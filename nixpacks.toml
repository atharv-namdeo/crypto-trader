[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "gcc", "stdenv.cc.cc.lib"]

[phases.install]
cmds = [
  "pip3 install --break-system-packages numpy pandas scikit-learn scipy",
  "pip3 install --break-system-packages torch==2.2.2+cpu --extra-index-url https://download.pytorch.org/whl/cpu",
  "pip3 install --break-system-packages -r requirements.txt"
]

[start]
cmd = "python3 main.py"
