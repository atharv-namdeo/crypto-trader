# Institutional v11.1.4 "Grandmaster" Orchestration
version: '3.8'

services:
  # The Core Trading Engine
  bot:
    build: .
    container_name: grandmaster_engine
    restart: always
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONPATH=.
      - PORT=8000
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      - redis

  # State Persistence & Dashboard Sync
  redis:
    image: redis:alpine
    container_name: grandmaster_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

volumes:
  redis_data:
