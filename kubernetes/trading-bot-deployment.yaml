apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-bot
  namespace: crypto-trader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-bot
  template:
    metadata:
      labels:
        app: trading-bot
    spec:
      containers:
      - name: trading-bot
        image: crypto-trader:phase9-prod
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_URL
          value: "redis://redis:6379"
        # Secrets should be handled externally in production (e.g., Vault or K8s Secrets)
        # - name: BINANCE_API_KEY
        #   valueFrom:
        #     secretKeyRef:
        #       name: binance-credentials
        #       key: api-key
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /metrics/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /metrics/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
